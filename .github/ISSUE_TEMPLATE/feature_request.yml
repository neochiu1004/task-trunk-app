name: Feature request
description: Suggest an improvement or workflow for Task Trunk App.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What user workflow would this improve?
      placeholder: I often need to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there simpler ways to solve the same problem?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples or screenshots after removing private data.
