name: Bug report
description: Report a reproducible problem in Task Trunk App.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please redact ticket serial numbers,
        QR codes, redemption links, and other private data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: The app did...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Open...
        2. Tap...
        3. Upload...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Safari 18, Chrome 125, Firefox 126
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iPhone, Android phone, Mac, Windows PC
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Add screenshots, logs, or notes after removing private data.
